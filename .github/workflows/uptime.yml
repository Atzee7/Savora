name: Uptime ping

on:
  schedule:
    # Setiap hari 02:17 UTC (09:17 WIB). Menjaga Supabase free tier tetap aktif.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cek /api/health
        env:
          HEALTH_URL: https://savora-lyart-six.vercel.app/api/health
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if body=$(curl -fsS --max-time 30 "$HEALTH_URL"); then
              echo "$body"
              echo "$body" | grep -q '"database":"up"'
              exit 0
            fi
            echo "Percobaan $attempt gagal, mengulang..."
            sleep 20
          done

          echo "Ping gagal setelah 3 percobaan." >&2
          exit 1
